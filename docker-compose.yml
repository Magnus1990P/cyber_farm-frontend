networks:
  cyberfarm_backend:
    external: false

services:
  frontend:
    image: cff:latest
    build: .
    container_name: frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_HOST=api
      - NEXT_PUBLIC_API_PORT=2000
    ports:
      - 3000:3000
    networks:
      - cyberfarm_backend
